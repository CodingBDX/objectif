name: Alertes favoris disponibles
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler le site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          curl -fsS -X POST -H "x-cron-secret: $CRON_SECRET" "$SITE_URL/api/alerte-dispo"
